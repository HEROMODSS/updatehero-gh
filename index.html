<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#050B18" />
  <title>UpdateHero — GitHub Panel</title>
  <link rel="icon" href="/logo.png" />
  <link rel="apple-touch-icon" href="/logo.png" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <script>
    (function () {
      try {
        var mode = localStorage.getItem('uh-mode') || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        var color = localStorage.getItem('uh-color') || 'blue';
        document.documentElement.setAttribute('data-mode', mode);
        document.documentElement.setAttribute('data-color', color);
      } catch (e) {
        document.documentElement.setAttribute('data-mode', 'dark');
        document.documentElement.setAttribute('data-color', 'blue');
      }
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
